<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundtrackDB Plug & Play Widget Demo</title>
    <style>
        body {
            background: #090b10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: rgba(255, 255, 255, 0.7);
        }
        .demo-note {
            margin-top: 16px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-family: monospace;
        }
    </style>
</head>
<body>

    <!-- 1. The Container with your target IMDb ID -->
    <div class="soundtrackdb-widget" data-imdb="tt0816692"></div>

    <!-- 2. The Plug & Play Script (Self-mounting, zero CSS dependencies) -->
    <script src="./widget.js" async></script>

    <div class="demo-note">
        Tip: Change data-imdb to any IMDb ID (e.g. tt15239678 for Dune: Part Two)
    </div>

</body>
</html>
